name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v0.1.0-beta.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag and source branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      branch: ${{ steps.release.outputs.branch }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Fetch release branches
        run: git fetch --no-tags origin main beta

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"

      - name: Validate release tag
        id: release
        run: node .github/scripts/validate-release.mjs
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install release test dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test desktop release policies
        run: bun run --cwd apps/desktop test:release

      - name: Typecheck desktop release surface
        run: bun run --cwd apps/desktop typecheck:release

  build:
    name: Build (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            pack: pack:mac-arm64
          - os: macos-15-intel
            platform: mac-x64
            pack: pack:mac-x64
          - os: windows-2025
            platform: win-x64
            pack: pack:win-x64
          - os: ubuntu-24.04
            platform: linux-x64
            pack: pack:linux-x64

    env:
      ECO_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ECO_RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      ECO_RELEASE_UNSIGNED: "true"
      ECO_RELEASE_REPOSITORY: ${{ github.repository }}
      ECO_MAC_UPDATE_MODE: "manual"
      ECO_WINDOWS_UPDATE_MODE: "auto"
      ECO_LINUX_UPDATE_MODE: "auto"
      ECO_RELEASE_URL: https://github.com/${{ github.repository }}/releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set desktop version
        run: node .github/scripts/set-desktop-version.mjs

      - name: Pack
        # macOS unsigned builds adhoc re-sign in apps/desktop/scripts/after-pack.mjs
        # so browser downloads do not show Gatekeeper's misleading "damaged" dialog.
        run: bun run --cwd apps/desktop ${{ matrix.pack }}

      - name: Smoke the packaged PI runtime
        # Runs against the app that was just packed, not the repo tree: the PI closure is
        # external and unpacked, and the codemode sandbox derives its worker path and its
        # QuickJS wasm from `import.meta.url` / `createRequire`. Loading that from
        # `app.asar` under Electron's Node is the only way to catch an asarUnpack rule that
        # silently stopped matching. It runs a real script through the shipped worker, and
        # asserts the shipped SDK still exports the official MCP and codemode extensions.
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: bun run --cwd apps/desktop smoke:packaged-pi

      - name: Make AppImage executable
        if: matrix.platform == 'linux-x64'
        run: chmod +x apps/desktop/release/*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eco-coding-${{ matrix.platform }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Assemble and publish Release
    needs: [validate, build]
    runs-on: ubuntu-24.04

    env:
      ECO_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ECO_RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install release script dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eco-coding-*
          merge-multiple: false
          path: release-raw

      - name: Assemble release assets
        run: >
          node .github/scripts/prepare-release-assets.mjs
          --channel "$ECO_RELEASE_CHANNEL"
          --version "$ECO_RELEASE_VERSION"
          --raw release-raw
          --output release-assets
          --feed-output release-feed
          --repository "$GITHUB_REPOSITORY"

      - name: Validate release assets
        run: >
          node .github/scripts/validate-release-assets.mjs
          --directory release-assets
          --feed-directory release-feed
          --version "$ECO_RELEASE_VERSION"
          --channel "$ECO_RELEASE_CHANNEL"
          --repository "$GITHUB_REPOSITORY"

      - name: Verify SHA256 checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Build release notes from CHANGELOG
        # The release body comes from CHANGELOG.md, not GitHub's auto notes: this repo
        # commits straight to the release branch, so auto notes collapse to a bare
        # compare link. A missing section fails the job instead of shipping an empty body.
        run: node .github/scripts/extract-release-notes.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Mori ${{ needs.validate.outputs.tag }}
          prerelease: ${{ needs.validate.outputs.channel == 'beta' }}
          make_latest: ${{ needs.validate.outputs.channel == 'latest' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish update feed pointers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FEED_TAG=desktop-update-feed
          if ! gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Desktop update feed" \
              --notes "Mutable channel yml pointers for electron-updater (generic provider). Binaries live on versioned releases; do not delete this tag." \
              --latest=false
          fi
          gh release upload "$FEED_TAG" release-feed/* --repo "$GITHUB_REPOSITORY" --clobber
