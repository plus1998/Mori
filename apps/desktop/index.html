<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Coding</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      html[data-platform="linux"][data-theme="dark"],
      html[data-platform="linux"][data-theme="dark"] body {
        background: #212121;
      }

      html[data-platform="linux"][data-theme="light"],
      html[data-platform="linux"][data-theme="light"] body {
        background: #ffffff;
      }

      /* Match the native macOS splash: only the boot icon sits over the backdrop. */
      html[data-platform="win32"][data-theme]:not([data-app-ready]),
      html[data-platform="win32"][data-theme]:not([data-app-ready]) body,
      html[data-platform="win32"][data-theme]:not([data-app-ready]) #root {
        background: transparent;
      }

      #root {
        min-height: 100%;
      }

      .app-boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
        z-index: 0;
      }

      .app-boot-splash__icon {
        width: 96px;
        height: 96px;
        object-fit: contain;
        -webkit-user-drag: none;
        user-select: none;
        opacity: 0.92;
        animation: app-boot-splash-breathe 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-splash__icon {
          animation: none;
        }
      }

      @keyframes app-boot-splash-breathe {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }
    </style>
    <script>
      (() => {
        function systemTheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        function resolveTheme(stored) {
          if (stored === "light") return "light";
          if (stored === "dark") return "dark";
          return systemTheme();
        }
        function resolvePlatform() {
          var platform = navigator.platform || "";
          var userAgent = navigator.userAgent || "";
          if (/Mac|iPhone|iPad|iPod/.test(platform) || /Macintosh|Mac OS X/.test(userAgent)) return "darwin";
          if (/Win/.test(platform) || /Windows/.test(userAgent)) return "win32";
          if (/Linux/.test(platform) || /Linux/.test(userAgent)) return "linux";
          return platform.trim().toLowerCase() || "unknown";
        }
        try {
          var stored = localStorage.getItem("eco.app-theme");
          document.documentElement.dataset.theme = resolveTheme(stored);
        } catch (error) {
          document.documentElement.dataset.theme = systemTheme();
        }
        document.documentElement.dataset.platform = resolvePlatform();
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-splash" aria-hidden="true">
        <img class="app-boot-splash__icon" src="./splash-icon.png" alt="" width="96" height="96" />
      </div>
    </div>
    <script type="module" src="/src/renderer/App.tsx"></script>
  </body>
</html>
