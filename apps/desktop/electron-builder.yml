appId: com.eco.coding
productName: Mori
copyright: Copyright © Mori

# Register mori:// and retain eco:// so links from older releases still open
# this app (see main-process open-url / second-instance handling).
protocols:
  - name: Mori
    schemes: [mori, eco]

directories:
  output: release
  buildResources: packaging

# icon.icns / icon.ico / icon.png in packaging/ (see `bun run icons`)

files:
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  # In-process Agent focus interception must be loaded from a real signed dylib.
  - "dist/native/browser-focus-hook/**"
  - "**/node_modules/@anthropic-ai/**"
  # Native Codex CLI + platform binaries (and code-mode host) cannot run from inside asar.
  - "**/node_modules/@openai/**"
  - "**/node_modules/agent-browser/**"
  - "**/node_modules/@qwen-code/open-computer-use/**"
  # The PTY native module and its spawn-helper must both be real files.
  - "**/node_modules/node-pty/**"
  # Keyring credential store (external native binding).
  - "**/node_modules/@napi-rs/keyring/**"
  - "**/node_modules/@napi-rs/keyring-*/**"
  - "**/node_modules/@napi-rs/canvas-*/**"
  # Win32 Job Object FFI for ACP process-tree cleanup (Zed-aligned).
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/koffi-*/**"
  # PI SDK runtime closure. The codemode sandbox spawns a worker thread and
  # compiles a QuickJS wasm, so those files must exist as real files rather than
  # as asar members: `new Worker()` and `WebAssembly.compile()` are handed the
  # paths that `import.meta.url` / `createRequire` derive from the package.
  - "**/node_modules/@earendil-works/**"
  - "**/node_modules/quickjs-wasi/**"
  # wasm-bindgen glue reads its sibling .wasm through a real path.
  - "**/node_modules/@silvia-odwyer/photon-node/**"

# Platform agent-browser native binary for CDP-driven Agent tools.
extraResources:
  - from: ../../supabase/
    to: supabase
    filter:
      - config.toml
      - deployment.json
      - migrations/*.sql
      - functions/**/*.ts
      - functions/**/*.json
  - from: packaging/agent-browser/
    to: agent-browser
    filter:
      - "**/*"
  - from: packaging/open-computer-use/
    to: open-computer-use
    filter:
      - "**/*"
  - from: packaging/skills/
    to: skills
    filter:
      - "**/*"
  # Legacy debug-only; agents use HTTP MCP. Keep for offline stdio probing.
  - from: packaging/eco-computer-use-mcp-stdio.mjs
    to: eco-computer-use-mcp-stdio.mjs

npmRebuild: false
nodeGypRebuild: false

afterPack: scripts/after-pack.mjs

# Generic feed URL is embedded in app-update.yml. Channel yml pointers live on the
# long-lived `desktop-update-feed` GitHub Release; binaries stay on versioned tags.
# pack-release.mjs always passes --publish never and overrides publish.url.
publish:
  provider: generic
  url: https://github.com/plus1998/Mori/releases/download/desktop-update-feed
  channel: latest

detectUpdateChannel: false
generateUpdatesFilesForAllChannels: false

mac:
  minimumSystemVersion: "13.0.0"
  # afterPack uses our pinned self-signed identity, not electron-builder's Apple
  # certificate discovery. Self-signing does not provide Gatekeeper trust or notarization;
  # automatic-update rollout is controlled separately by the release manifest.
  identity: null
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Mori needs microphone access for voice transcription.
    CFBundleURLTypes:
      - CFBundleURLName: Mori
        CFBundleURLSchemes:
          - mori
          - eco
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Mori-${version}-mac-${arch}.${ext}

win:
  icon: packaging/icon.ico
  signAndEditExecutable: false
  artifactName: Mori-${version}-win-x64.${ext}
  signtoolOptions:
    sign: scripts/win-sign.mjs
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64

linux:
  executableName: eco-coding
  synopsis: Mori
  description: Mori desktop app
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: Mori-${version}-linux-x64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
