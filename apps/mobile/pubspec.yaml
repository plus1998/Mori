name: eco_mobile
description: Mori mobile remote client for Mori Desktop via user-owned Supabase Center.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  # 7.x uses Apple Vision on iOS; 6.x excludes arm64 Apple Silicon simulators.
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  device_info_plus: ^11.5.0
  network_info_plus: ^6.1.4
  flutter_markdown: ^0.7.7+1
  lucide_icons_flutter: ^3.1.14+2
  adaptive_platform_ui: ^0.1.107
  record: ^6.2.1
  supabase_flutter: ^2.9.1
  sqflite: 2.4.2+1
  path: ^1.9.1
  webview_flutter: ^4.14.1
  markdown: ^7.3.1
  flutter_tts: ^4.2.2
  refresh_rate: ^2.0.1
  wakelock_plus: ^1.3.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  audio_session: ^0.2.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splash-icon.png
    - assets/launch-splash-mark.png
    - assets/mermaid/host.html
    - assets/mermaid/mermaid.min.js
  shaders:
    - shaders/progressive_blur.frag
