n:7px 0}.login-account{justify-content:flex-start;width:100%;margin:8px 0 3px}.login-account svg{margin-left:auto}

<script>
'use strict';
const $ = id => document.getElementById(id);
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escaped = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sites = {
  billing:{name:'松木云账单',brand:'松木云',url:'billing.pinecloud.example/invoices',icon:'bill',title:'账单与发票',suggestion:'帮我下载最新一期的账单。',file:'mori-demo-invoice.csv',csv:'Month,Amount,Currency\nNovember,268.00,CNY\n'},
  docs:{name:'北岸文档',brand:'北岸文档',url:'docs.northshore.example/files',icon:'doc',title:'文档工作区',suggestion:'帮我导出本周的项目清单。',file:'mori-demo-project-list.csv',csv:'Project,Status\nPrototype,Ready\n'},
};
const loginKey = 'mori-browser-prototype-logins';
const defaultLogins = () => ({billing:false,docs:true});
let logins = defaultLogins();
try {
  const saved = JSON.parse(localStorage.getItem(loginKey));
  for (const key of Object.keys(sites)) if (typeof saved?.[key] === 'boolean') logins[key] = saved[key];
} catch { /* A local preview may restrict storage. */ }
function saveLogins() { try { localStorage.setItem(loginKey,JSON.stringify(logins)); } catch { /* State remains in this preview. */ } }
let tabs, focused, nextId, attachment, tasks, timer, notice;
const selected = () => tabs.find(tab => tab.id === focused);
const active = () => tasks.find(task => ['running','verify','ready','resumed'].includes(task.state));
const owned = tab => tab && active()?.tabId === tab.id;
function addTab(key) { const tab = {id:nextId++,key}; tabs.push(tab); return tab.id; }
function expandBrowser(expanded) {
  $('workspace').classList.toggle('expanded', expanded);
  const button = $('expand');
  const label = expanded ? '恢复与对话并排' : '展开浏览器';
  button.setAttribute('aria-label', label);
  button.title = label;
  button.innerHTML = icon(expanded ? 'collapse' : 'expand');
}
function show(open, focus = false) {
  $('browser').hidden = !open;
  if (!open) expandBrowser(false);
  if (focus) $(open ? 'expand' : 'profile-trigger').focus();
}
function focusTab(id) { if (tabs.some(tab => tab.id === id)) { focused = id; render(); } }
function reset(clear) {
  clearTimeout(timer);
  if (clear) { logins = defaultLogins(); saveLogins(); }
  tabs = []; nextId = 1; focused = addTab('billing'); addTab('docs');
  $('profile').hidePopover();
  attachment = null; tasks = []; notice = ''; $('message').value = ''; show(false); render();
}
function popup(title, html) { $('dialog-title').textContent = title; $('dialog-body').innerHTML = html; $('dialog').showModal(); }
function renderTabs() {
  $('tabs').innerHTML = tabs.map(tab => {
    const site = sites[tab.key], label = site?.name ?? '新标签页';
    return `<div class="tab ${tab.id===focused?'active':''}"><button class="label" data-action="tab" data-id="${tab.id}" aria-pressed="${tab.id===focused}">${icon(site?.icon ?? 'globe')}<span>${label}</span>${owned(tab)?'<span class="direct" aria-label="Mori 正在使用">•</span>':''}</button><button class="iconbtn" data-action="close-tab" data-id="${tab.id}" title="关闭${label}" aria-label="关闭${label}" ${owned(tab)?'disabled':''}>${icon('x')}</button></div>`;
  }).join('');
}
function renderBrowser() {
  renderTabs();
  const tab = selected(), key = tab.key, site = sites[key], task = active(), busy = owned(tab);
  $('address').textContent = site?.url ?? '新标签页';
  $('handoff').disabled = !site || !!task || !logins[key];
  $('handoff').title = !site ? '请选择网页' : !logins[key] ? '请先登录此页' : task ? '请先结束当前任务' : '把当前标签页附到对话';
  const bar = $('runbar'); bar.hidden = !busy;
  if (busy) {
    bar.classList.toggle('wait',['verify','ready'].includes(task.state));
    bar.innerHTML = `<span role="status">${task.state==='verify'?'已暂停，等待你验证':task.state==='ready'?'验证通过，等待继续':'Mori 正在操作此标签页'}</span><button class="btn" data-action="takeover">${icon('pause')}接管</button>`;
  }
  if (!site) {
    $('site').innerHTML = `<div class="sitebody"><h1>新标签页</h1><div class="quicklinks">${Object.entries(sites).map(([id,s])=>`<button class="btn" data-action="site" data-key="${id}">${icon(s.icon)}${s.name}</button>`).join('')}</div></div>`;
    return;
  }
  const billing = key === 'billing';
  const header = `<div class="sitehead"><div class="sitebrand">${icon(site.icon)}${site.brand}</div><div class="account">${logins[key]?'<span class="online">已登录</span><span class="avatar">林</span>林晓':'未登录'}</div></div>`;
  const signin = `<div class="signin"><p>登录后查看${billing?'账单':'文件'}</p><button class="btn primary" data-action="signin" data-key="${key}">登录演示账号</button></div>`;
  const verify = busy && task.state==='verify' ? `<div class="verification"><strong>请再次验证身份</strong><p>验证通过后才能导出账单。</p><button class="btn" data-action="verify">${icon('shield')}模拟完成验证</button></div>` : '';
  const summary = billing ? '<div class="summary">本期账单 <strong>¥ 268.00</strong></div>' : '<div class="summary">最近文件 <strong>2 份</strong></div>';
  const billRows = '<tr><td>11 月账单</td><td>11 月 20 日</td><td>¥ 268.00</td><td class="online">已支付</td></tr><tr><td>10 月账单</td><td>10 月 20 日</td><td>¥ 268.00</td><td class="online">已支付</td></tr>';
  const docRows = '<tr><td>本周项目清单</td><td>11 月 20 日</td><td>表格</td></tr><tr><td>团队周报</td><td>11 月 18 日</td><td>文档</td></tr>';
  const table = `<div class="table"><table aria-label="${site.name}"><thead><tr><th>名称</th><th>日期</th>${billing?'<th>金额</th><th>状态</th>':'<th>类型</th>'}</tr></thead><tbody>${billing?billRows:docRows}</tbody></table></div>`;
  $('site').innerHTML = `${header}<div class="sitebody"><p class="crumb">${billing?'账户设置 / 账单':'产品团队 / 文件'}</p><h1>${site.title}</h1>${logins[key] ? verify+summary+table : signin}</div>`;
}
const states = {
  running:['sparkles','Mori 正在操作','正在读取你授权的网页。'],
  verify:['shield','等待你验证','Mori 已暂停，等待你在网页里完成验证。'],
  ready:['shield','验证已通过','页面已就绪，可以继续任务。'],
  resumed:['sparkles','Mori 正在操作','正在准备演示文件。'],
  done:['check','已完成，授权结束','演示文件已准备好。'],
  stopped:['pause','你已接管，授权结束','Mori 已停止操作，网页仍在浏览器里。'],
};
function renderChat() {
  const s = attachment && sites[attachment.key], task = active();
  $('attachment').hidden = !s; $('attached-name').textContent = s?.name ?? '';
  $('suggest').hidden = !s; $('send').disabled = !s || !!task || !$('message').value.trim();
  $('scope').textContent = notice || (task?`仅授权：${sites[task.key].name}`:s?`发送后仅授权：${s.name}`:'未授权任何网页');
  $('scope').classList.toggle('error',!!notice);
  const recent = tasks.at(-1);
  $('profile-status').textContent = task ? states[task.state][1] : '可以协助处理网页';
  $('profile-activity').textContent = recent ? `${sites[recent.key].name} · ${states[recent.state][1]}` : '暂无浏览器活动';
  const html = tasks.map(t => {
    const [glyph,title,desc] = states[t.state], site = sites[t.key];
    const command = t.state==='ready' ? '<button class="btn primary" data-action="resume">继续任务</button>' : t.state==='verify' && ($('browser').hidden || focused!==t.tabId) ? `<button class="btn" data-action="show-tab" data-id="${t.tabId}">打开待验证网页</button>` : t.state==='done' ? `<button class="btn" data-action="download" data-id="${t.id}">${icon('down')}下载${t.key==='billing'?'账单':'清单'}.csv</button>` : '';
    return `<div class="message user"><div class="bubble"><span class="name">你 · ${site.name}</span><p>${escaped(t.text)}</p></div></div><div class="message"><span class="mark">${icon('sparkles')}</span><div class="agenttext"><span class="name">Mori</span><div class="result" data-state="${t.state}"><strong>${icon(glyph)}${title}</strong><p>${desc}</p>${command}</div></div></div>`;
  }).join('');
  if (renderChat.last !== html) { renderChat.last = html; $('activity').innerHTML = html; $('feed').scrollTop = $('feed').scrollHeight; }
}
function render() { renderBrowser(); renderChat(); }
function later(task, state, next, ms) {
  clearTimeout(timer);
  timer = setTimeout(() => { if (active()===task && task.state===state) { task.state=next; render(); } },ms);
}
$('profile').addEventListener('toggle', event => {
  $('profile-trigger').setAttribute('aria-expanded', String(event.newState === 'open'));
});
$('open').onclick = () => { $('profile').hidePopover(); show(true,true); renderChat(); };
$('expand').onclick = () => { expandBrowser(!$('workspace').classList.contains('expanded')); };
$('close').onclick = () => { show(false,true); renderChat(); };
$('new-tab').onclick = () => { focusTab(addTab('home')); $('tabs').scrollLeft=$('tabs').scrollWidth; };
$('handoff').onclick = () => {
  const tab = selected();
  if (active() || !logins[tab.key]) return;
  attachment = {tabId:tab.id,key:tab.key}; notice='';
  expandBrowser(false);
  renderChat(); $('message').focus();
};
$('detach').onclick = () => { attachment=null; notice=''; renderChat(); $('message').focus(); };
$('suggest').onclick = () => { if (attachment) { $('message').value=sites[attachment.key].suggestion; renderChat(); $('message').focus(); } };
$('message').addEventListener('input',renderChat);
$('composer').addEventListener('submit',event => {
  event.preventDefault(); const text=$('message').value.trim();
  if (!text || !attachment || active()) return;
  if (!tabs.some(t=>t.id===attachment.tabId && t.key===attachment.key) || !logins[attachment.key]) { notice='网页已不可用，请重新交接。'; attachment=null; renderChat(); return; }
  const task={...attachment,id:tasks.length,state:'running',text}; tasks.push(task);
  attachment=null; notice=''; $('message').value=''; focusTab(task.tabId);
  later(task,'running',task.key==='billing'?'verify':'done',2200);
});
$('bookmarks').onclick = () => popup('聊天 AI 对话','<p>原型不打开真实站点，也不读取现有书签或登录。</p>');
$('reset').onclick = () => reset(true);
document.addEventListener('click',event => {
  const button=event.target.closest('button[data-action]'); if (!button || button.disabled) return;
  const {action,key}=button.dataset, id=Number(button.dataset.id), tab=selected(), task=active();
  switch(action) {
    case 'tab': focusTab(id); break;
    case 'show-tab': show(true); focusTab(id); $('close').focus(); break;
    case 'close-tab': {
      const index=tabs.findIndex(t=>t.id===id); if (index<0 || owned(tabs[index])) break;
      tabs.splice(index,1); if (attachment?.tabId===id) attachment=null;
      if (!tabs.length) addTab('home');
      if (focused===id) focused=tabs[Math.min(index,tabs.length-1)].id;
      render(); $('tabs').querySelector('[aria-pressed="true"]')?.focus(); break;
    }
    case 'site': if (tab.key==='home' && sites[key]) { tab.key=key; render(); } break;
    case 'signin': popup(`登录${sites[key].brand}`,`<button class="btn login-account" data-action="sign-in" data-key="${key}"><span class="avatar">林</span>林晓 · 演示账号${icon('check')}</button><p>不需要输入真实账号或密码。</p>`); break;
    case 'sign-in': logins[key]=true; saveLogins(); $('dialog').close(); render(); $('handoff').focus(); break;
    case 'takeover': if (owned(tab)) { clearTimeout(timer); task.state='stopped'; render(); $('handoff').focus(); } break;
    case 'verify': if (owned(tab) && task.state==='verify') { task.state='ready'; expandBrowser(false); render(); $('activity').querySelector('[data-action="resume"]')?.focus(); } break;
    case 'resume': if (task?.state==='ready') { task.state='resumed'; show(true); focusTab(task.tabId); later(task,'resumed','done',1300); } break;
    case 'download': {
      const record=tasks[id]; if (record?.state!=='done') return;
      const site=sites[record.key], url=URL.createObjectURL(new Blob([site.csv],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a'); a.href=url; a.download=site.file;
      document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); break;
    }
  }
});
reset(false);
</script>
